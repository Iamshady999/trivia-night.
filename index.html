<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<title>TRIVIA NIGHT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <section id="home" class="screen" aria-labelledby="homeTitle">
    <header class="hero">
      <h1 id="homeTitle" class="logo">TRIVIA<br>NIGHT</h1>
      <p class="tagline">No preparation. No awkward silence. Just questions.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="startBtn" type="button">START A GAME</button>
        <button class="btn btn-secondary" id="quickBtn" type="button">QUICK 10 ⚡</button>
      </div>
    </header>
    <h2 class="section-title" id="catTitle">Pick your poison</h2>
    <div class="cat-grid" id="catGrid"></div>
  </section>

  <section id="setup" class="screen" hidden aria-labelledby="setupTitle">
    <button class="link-btn" id="backHome" type="button">← Back</button>
    <div class="setup-cat" id="setupCat"></div>
    <h2 id="setupTitle" class="section-title">Set the rules</h2>
    <div class="group" role="radiogroup" aria-label="Difficulty" id="diffGroup"></div>
    <div class="group" role="radiogroup" aria-label="Number of questions" id="countGroup"></div>
    <p class="note" id="setupNote" aria-live="polite"></p>
    <button class="btn btn-primary btn-wide" id="beginBtn" type="button">START GAME</button>
  </section>

  <section id="game" class="screen" hidden aria-label="Game">
    <div class="game-top">
      <span class="mini-logo">TRIVIA NIGHT</span>
      <span class="score-pill">⭐ <b id="scoreVal">0</b></span>
    </div>
    <div class="progress-row">
      <span id="qCount">Question 1/10</span>
      <div class="timer" id="timer" role="timer" aria-label="Seconds left">15</div>
    </div>
    <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
    <div class="streak" id="streak" aria-live="polite"></div>
    <article class="q-card" id="qCard">
      <p class="q-meta" id="qMeta"></p>
      <h2 id="qText"></h2>
    </article>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite" hidden>
      <p class="fb-title" id="fbTitle"></p>
      <p class="fb-text" id="fbText"></p>
      <button class="btn btn-secondary" id="nextBtn" type="button">NEXT</button>
    </div>
  </section>

  <section id="results" class="screen" hidden aria-labelledby="resTitle">
    <h2 id="resTitle" class="res-title">YOU SURVIVED<br>TRIVIA NIGHT.</h2>
    <div class="res-score"><span id="resScore">0</span> POINTS</div>
    <p class="rating" id="rating"></p>
    <div class="stats">
      <div><b id="stCorrect"></b><span>Correct</span></div>
      <div><b id="stAcc"></b><span>Accuracy</span></div>
      <div><b id="stStreak"></b><span>Best streak</span></div>
      <div><b id="stTime"></b><span>Avg answer time</span></div>
    </div>
    <div class="hero-actions">
      <button class="btn btn-primary" id="againBtn" type="button">PLAY AGAIN</button>
      <button class="btn btn-secondary" id="changeBtn" type="button">CHANGE CATEGORY</button>
    </div>
  </section>

</main>
<script src="script.js"></script>
</body>
</html>
